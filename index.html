<!-- =====================================================
     MENU
===================================================== -->

<nav>

    <a
        href="#"
        class="nav-logo">

        <img
            src="logo-felipe.png"
            alt="Felipe Smith">

    </a>


    <button
        class="menu-button"
        onclick="toggleMenu()"
        aria-label="Abrir menu">

        ☰

    </button>


    <div
        class="nav-links"
        id="navLinks">

        <a href="#about">
            Sobre
        </a>

        <a href="#social">
            Conecte-se
        </a>

        <a href="#tracks">
            Tracks
        </a>

        <a href="#video">
            Vídeo
        </a>

        <a href="#music">
            Estilos
        </a>

        <a href="#press">
            Press Kit
        </a>

        <a href="#contact">
            Contato
        </a>

    </div>

</nav>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

    /* =====================================================
       INICIAR SITE NO TOPO
    ===================================================== */

    if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
    }

    window.addEventListener("load", function () {
        window.scrollTo(0, 0);
    });


    /* =====================================================
       MENU MOBILE
    ===================================================== */

    function toggleMenu() {

        const menu =
            document.getElementById("navLinks");

        menu.classList.toggle("active");

    }


    /* Fecha o menu ao clicar em um link */

    document
        .querySelectorAll(".nav-links a")
        .forEach(function (link) {

            link.addEventListener("click", function () {

                document
                    .getElementById("navLinks")
                    .classList.remove("active");

            });

        });

</script>
